<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Role Selection Screen Mockup</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center p-4 min-h-screen">

  <!-- Mobile Device Frame Container -->
  <div class="w-[360px] h-[740px] bg-[#FBFBFD] shadow-2xl rounded-[40px] overflow-hidden border-[10px] border-slate-900 relative flex flex-col font-sans select-none">
    
    <!-- Phone Status Bar -->
    <div class="h-10 px-6 flex justify-between items-center text-slate-800 text-xs font-semibold z-10">
      <span>09:41</span>
      <div class="flex items-center space-x-1.5">
        <!-- Signal Icons -->
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.2 19.58 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- App Bar Navigation -->
    <div class="h-14 px-4 flex items-center">
      <button class="p-2 rounded-full hover:bg-slate-200/50 transition active:scale-95">
        <!-- Chevron Left -->
        <svg class="w-6 h-6 text-slate-800" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Main Body Layout -->
    <div class="flex-1 px-6 flex flex-col">
      <div class="mt-4">
        <!-- Headline -->
        <h1 class="text-[28px] font-extrabold text-slate-800 tracking-tight leading-tight">Choose Your Role</h1>
        <!-- Subheading -->
        <p class="text-sm font-medium text-slate-500 mt-2">Select how you want to continue</p>
      </div>

      <!-- Cards Grid -->
      <div class="mt-10 space-y-5">
        
        <!-- Patient Card -->
        <div class="group relative bg-white border border-slate-200/80 rounded-2xl p-5 flex items-center transition shadow-sm hover:border-pink-300 hover:shadow-md cursor-pointer">
          <!-- Icon Circle Container -->
          <div class="w-[60px] h-[60px] bg-pink-50 rounded-full flex items-center justify-center shrink-0">
            <!-- Patient / Person Icon -->
            <svg class="w-8 h-8 text-pink-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          
          <!-- Text Labels -->
          <div class="ml-4 flex-1">
            <h2 class="text-[17px] font-bold text-slate-800">I am a Patient</h2>
            <p class="text-[13px] text-slate-400 font-medium mt-0.5 leading-snug">Manage my health records and information</p>
          </div>

          <!-- Arrow Indicator -->
          <div class="w-9 h-9 bg-pink-500/10 rounded-full flex items-center justify-center shrink-0 ml-2">
            <svg class="w-3.5 h-3.5 text-pink-500 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

        <!-- Doctor Card -->
        <div class="group relative bg-white border border-slate-200/80 rounded-2xl p-5 flex items-center transition shadow-sm hover:border-purple-300 hover:shadow-md cursor-pointer">
          <!-- Icon Circle Container -->
          <div class="w-[60px] h-[60px] bg-purple-50 rounded-full flex items-center justify-center shrink-0">
            <!-- Stethoscope / Medical Icon -->
            <svg class="w-8 h-8 text-purple-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
            </svg>
          </div>
          
          <!-- Text Labels -->
          <div class="ml-4 flex-1">
            <h2 class="text-[17px] font-bold text-slate-800">I am a Doctor</h2>
            <p class="text-[13px] text-slate-400 font-medium mt-0.5 leading-snug">Access and manage patient information</p>
          </div>

          <!-- Arrow Indicator -->
          <div class="w-9 h-9 bg-purple-500/10 rounded-full flex items-center justify-center shrink-0 ml-2">
            <svg class="w-3.5 h-3.5 text-purple-500 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

      </div>

      <!-- Push layout down -->
      <div class="flex-grow"></div>

      <!-- Footer Info Row -->
      <div class="flex items-center justify-center space-x-1.5 py-4">
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-xs text-slate-400 font-bold">You can change role later</span>
      </div>

      <!-- Discreet Admin Access Button Link -->
      <div class="flex justify-center pb-8">
        <a href="#" class="text-[11px] text-slate-400/50 hover:text-slate-400 underline transition active:scale-95">Admin Access</a>
      </div>

    </div>

  </div>

</body>
</html>
